services:
  db:
    image: postgres:16-alpine
    container_name: openpay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openpay
      POSTGRES_USER: openpay
      POSTGRES_PASSWORD: openpay_dev_password
    ports:
      - "5433:5432"
    volumes:
      - openpay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpay -d openpay"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  openpay_pgdata:
